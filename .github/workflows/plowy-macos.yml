name: Build Plowy (macOS)

on:
  push:
    branches: [barfak]
    paths: ["Plowy/**", ".github/workflows/plowy.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Plowy
    steps:
      - uses: actions/checkout@v4

      - name: Build universal binary
        run: |
          swift build -c release --arch arm64
          swift build -c release --arch x86_64
          mkdir -p build
          lipo -create -output build/Plowy-universal \
            .build/arm64-apple-macosx/release/Plowy \
            .build/x86_64-apple-macosx/release/Plowy
          lipo -info build/Plowy-universal

      - name: Package app and DMG
        run: |
          PLOWY_BINARY=build/Plowy-universal ./Scripts/build-app.sh
          mkdir -p build/dmg
          cp -R build/Plowy.app build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname Plowy -srcfolder build/dmg -ov -format UDZO build/Plowy.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Plowy-macOS
          path: Plowy/build/Plowy.dmg

      - name: Preview artwork and demo screenshots
        continue-on-error: true
        run: |
          mkdir -p build/preview
          build/Plowy-universal --dump-art build/preview
          swiftc -O Scripts/ci-mouse.swift -o build/ci-mouse
          mkdir -p ~/Desktop/Photos ~/Desktop/Work && touch ~/Desktop/notes.txt
          open -a TextEdit || true
          sleep 3
          PLOWY_DEMO=1 build/Plowy.app/Contents/MacOS/Plowy > build/preview/log.txt 2>&1 &
          sleep 9
          screencapture -x build/preview/shot1.png || true
          sleep 7
          screencapture -x build/preview/shot2.png || true
          kill %1 || true
          sleep 1
          defaults write local.plowy.app iconSnow -bool false
          defaults write local.plowy.app lightStyle -int 3
          PLOWY_DEMO=1 build/Plowy.app/Contents/MacOS/Plowy > /dev/null 2>&1 &
          sleep 5
          build/ci-mouse 60 763 330 763
          build/ci-mouse 512 54 957 185
          sleep 1
          screencapture -x build/preview/shot3.png || true
          build/ci-mouse 330 745 200 500
          sleep 1
          screencapture -x build/preview/shot4.png || true
          kill %2 || true

      - name: Publish preview images
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view plowy-preview >/dev/null 2>&1 || gh release create plowy-preview \
            --target "$GITHUB_SHA" --prerelease --title "Plowy build previews" --notes "Automated screenshots."
          gh release upload plowy-preview build/preview/* --clobber

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Plowy-preview
          path: Plowy/build/preview

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=plowy-latest
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/Plowy.dmg --clobber
          else
            gh release create "$TAG" build/Plowy.dmg --target "$GITHUB_SHA" \
              --prerelease --title "Plowy (macOS)" \
              --notes "Plowy.dmg را دانلود کنید و برنامه را به Applications بکشید."
          fi
