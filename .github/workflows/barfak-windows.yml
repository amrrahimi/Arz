name: Build Barfak (Windows)

on:
  push:
    branches: [barfak]
    paths: ["BarfakWin/**", ".github/workflows/barfak-windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: BarfakWin
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish self-contained exe
        run: |
          dotnet publish App -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out/publish
          Get-ChildItem out/publish

      - name: Build installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
          }
          & $iscc Installer/Barfak.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path out/publish/* -DestinationPath out/Barfak-Windows-Portable.zip -Force
          Get-ChildItem out

      - uses: actions/upload-artifact@v4
        with:
          name: Barfak-Windows
          path: |
            BarfakWin/out/Barfak-Setup.exe
            BarfakWin/out/Barfak-Windows-Portable.zip

      - name: Demo screenshots
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force out/preview | Out-Null
          Start-Process notepad
          Start-Sleep 2
          $env:BARFAK_DEMO = "1"
          $p = Start-Process out/publish/Barfak.exe -PassThru
          Start-Sleep 10
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $op = [System.Drawing.CopyPixelOperation]::SourceCopy -bor [System.Drawing.CopyPixelOperation]::CaptureBlt
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size, $op)
          $bmp.Save("$PWD/out/preview/win-shot1.png")
          Get-Process Barfak -ErrorAction SilentlyContinue | Select-Object Name, CPU, WorkingSet64 | Format-Table | Out-String | Set-Content out/preview/win-log.txt
          Stop-Process -Id $p.Id -Force

      - name: Publish release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload barfak-latest out/Barfak-Setup.exe out/Barfak-Windows-Portable.zip --clobber
          if (Test-Path out/preview/win-shot1.png) {
            gh release upload barfak-preview out/preview/win-shot1.png out/preview/win-log.txt --clobber
          }
