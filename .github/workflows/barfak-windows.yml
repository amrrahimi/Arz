name: Build Barfak (Windows)

on:
  push:
    branches: [barfak]
    paths: ["BarfakWin/**", ".github/workflows/barfak-windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: BarfakWin
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish self-contained exe
        run: |
          dotnet publish App -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out/publish
          Get-ChildItem out/publish

      - name: Build installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
          }
          & $iscc Installer/Barfak.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path out/publish/* -DestinationPath out/Barfak-Windows-Portable.zip -Force
          Get-ChildItem out

      - uses: actions/upload-artifact@v4
        with:
          name: Barfak-Windows
          path: |
            BarfakWin/out/Barfak-Setup.exe
            BarfakWin/out/Barfak-Windows-Portable.zip

      - name: Demo screenshots
        continue-on-error: true
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force out/preview | Out-Null
          Add-Type -Path Installer/CiHelper.cs -ReferencedAssemblies System.Drawing
          Start-Process notepad
          Start-Sleep 2
          $env:BARFAK_DEMO = "1"
          $p = Start-Process out/publish/Barfak.exe -PassThru
          Start-Sleep 10
          [CiHelper]::Shot("$PWD/out/preview/win-shot1.png")
          Add-Type -AssemblyName System.Windows.Forms
          $b = [System.Windows.Forms.Screen]::PrimaryScreen
          "bounds=$($b.Bounds) work=$($b.WorkingArea)" | Set-Content out/preview/win-log.txt
          $gy = $b.WorkingArea.Bottom - 4
          [CiHelper]::Drag(40, $gy, 330, $gy)
          [CiHelper]::Drag([int]($b.Bounds.Width / 2), $b.WorkingArea.Top + 24, [int]($b.Bounds.Width * 0.8), 200)
          Start-Sleep 2
          [CiHelper]::Shot("$PWD/out/preview/win-shot2.png")
          Get-Process Barfak -ErrorAction SilentlyContinue | Select-Object Name, CPU, WorkingSet64 | Format-Table | Out-String | Add-Content out/preview/win-log.txt
          Stop-Process -Id $p.Id -Force
          Get-Content "$env:TEMP\barfak-icons.txt" -ErrorAction SilentlyContinue | Select-Object -First 6 | Add-Content out/preview/win-log.txt

      - name: Publish release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload barfak-latest out/Barfak-Setup.exe out/Barfak-Windows-Portable.zip --clobber
          $files = Get-ChildItem out/preview -File | ForEach-Object { $_.FullName }
          if ($files) { gh release upload barfak-preview @files --clobber }
