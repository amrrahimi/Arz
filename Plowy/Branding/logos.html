<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Plowy logo options</title>
<style>
  body { margin: 0; background: #eef1f6; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(5, 220px); gap: 34px 26px; padding: 40px 44px 46px; }
  .cell { text-align: center; }
  .cell svg { width: 200px; height: 200px; filter: drop-shadow(0 10px 16px rgba(20,40,80,.22)); }
  .n { margin-top: 10px; font-size: 22px; font-weight: 700; color: #1d2a44; }
  .d { font-size: 14px; color: #5a6680; margin-top: 2px; }
  h1 { margin: 34px 44px 0; font-size: 26px; color: #1d2a44; }
</style></head><body>
<h1>Logo options — pick a number</h1>
<div class="grid" id="grid"></div>
<script>
// Shared squircle-ish app icon shape (macOS style rounded square).
const R = 'M265 40 H759 C893 40 984 131 984 265 V759 C984 893 893 984 759 984 H265 C131 984 40 893 40 759 V265 C40 131 131 40 265 40 Z';

function flake(cx, cy, r, stroke, w) {
  let s = '';
  for (let i = 0; i < 6; i++) {
    const a = i * Math.PI / 3 - Math.PI / 2;
    const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
    s += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/>`;
    for (const f of [0.45, 0.7]) {
      const bx = cx + Math.cos(a) * r * f, by = cy + Math.sin(a) * r * f;
      const l = r * (f === 0.45 ? 0.28 : 0.2);
      for (const sgn of [-1, 1]) {
        const b = a + sgn * Math.PI / 4;
        s += `<line x1="${bx}" y1="${by}" x2="${bx + Math.cos(b) * l}" y2="${by + Math.sin(b) * l}"/>`;
      }
    }
  }
  return `<g stroke="${stroke}" stroke-width="${w}" stroke-linecap="round">${s}</g>`;
}
function dots(n, seed, color, area) {
  let s = '', x = seed;
  const rnd = () => (x = (x * 9301 + 49297) % 233280) / 233280;
  for (let i = 0; i < n; i++) {
    const r = 5 + rnd() * 10;
    s += `<circle cx="${area[0] + rnd() * area[2]}" cy="${area[1] + rnd() * area[3]}" r="${r}" fill="${color}" opacity="${0.5 + rnd() * 0.5}"/>`;
  }
  return s;
}
const snowCap = (x, y, w, h) =>
  `<path d="M${x - 8} ${y + 6} C ${x - 6} ${y - h * .6}, ${x + w * .12} ${y - h}, ${x + w * .22} ${y - h * .8}
   C ${x + w * .3} ${y - h * 1.15}, ${x + w * .45} ${y - h * .7}, ${x + w * .55} ${y - h * .95}
   C ${x + w * .68} ${y - h * 1.2}, ${x + w * .8} ${y - h * .7}, ${x + w * .9} ${y - h * .85}
   C ${x + w} ${y - h * .9}, ${x + w + 10} ${y - h * .3}, ${x + w + 8} ${y + 6} Z" fill="#fff"/>
   <path d="M${x + w * .3} ${y + 4} q 10 26 22 2 M${x + w * .7} ${y + 4} q 8 34 20 0" fill="#fff"/>`;

const logos = [
 ['Crystal', 'Classic snowflake', `
  <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5aa8ff"/><stop offset="1" stop-color="#1747b8"/></linearGradient></defs>
  <path d="${R}" fill="url(#g1)"/>${flake(512, 512, 300, '#fff', 46)}
  <circle cx="512" cy="512" r="38" fill="#fff"/>`],

 ['Window', 'Snow settling on a window', `
  <defs><linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c2f5e"/><stop offset="1" stop-color="#0b1430"/></linearGradient></defs>
  <path d="${R}" fill="url(#g2)"/>${dots(26, 7, '#fff', [110, 100, 800, 260])}
  <rect x="210" y="400" width="604" height="420" rx="46" fill="#e9eef8"/>
  <rect x="210" y="400" width="604" height="92" rx="46" fill="#c7d2e6"/><rect x="210" y="450" width="604" height="42" fill="#c7d2e6"/>
  <circle cx="270" cy="446" r="16" fill="#ff5f57"/><circle cx="318" cy="446" r="16" fill="#febc2e"/><circle cx="366" cy="446" r="16" fill="#28c840"/>
  <rect x="262" y="540" width="330" height="26" rx="13" fill="#b9c4da"/><rect x="262" y="596" width="470" height="26" rx="13" fill="#b9c4da"/><rect x="262" y="652" width="400" height="26" rx="13" fill="#b9c4da"/>
  ${snowCap(210, 400, 604, 70)}`],

 ['Frosty', 'Snowman face', `
  <defs><linearGradient id="g3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fd6ff"/><stop offset="1" stop-color="#4c8fe0"/></linearGradient>
  <radialGradient id="b3" cx=".38" cy=".32" r=".8"><stop offset="0" stop-color="#fff"/><stop offset=".7" stop-color="#eef3fb"/><stop offset="1" stop-color="#c3d3ea"/></radialGradient></defs>
  <path d="${R}" fill="url(#g3)"/>
  <circle cx="512" cy="590" r="300" fill="url(#b3)"/>
  <rect x="320" y="150" width="384" height="190" rx="20" fill="#1f2230"/><rect x="250" y="320" width="524" height="56" rx="28" fill="#1f2230"/>
  <rect x="320" y="270" width="384" height="44" fill="#d8323a"/>
  <circle cx="420" cy="520" r="34" fill="#1f2230"/><circle cx="604" cy="520" r="34" fill="#1f2230"/>
  <circle cx="410" cy="508" r="10" fill="#fff"/><circle cx="594" cy="508" r="10" fill="#fff"/>
  <path d="M500 580 L 720 625 L 500 640 Z" fill="#ff8a1f"/>
  ${[0,1,2,3,4].map(i=>{const a=Math.PI*(.2+.15*i);return `<circle cx="${512-Math.cos(a)*130}" cy="${660+Math.sin(a)*70}" r="14" fill="#1f2230"/>`}).join('')}`],

 ['Globe', 'Snow globe', `
  <defs><linearGradient id="g4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b1f5c"/><stop offset="1" stop-color="#120c2c"/></linearGradient>
  <radialGradient id="gl4" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#bfe3ff" stop-opacity=".55"/><stop offset="1" stop-color="#5a8fd8" stop-opacity=".25"/></radialGradient></defs>
  <path d="${R}" fill="url(#g4)"/>
  <circle cx="512" cy="450" r="290" fill="url(#gl4)" stroke="#d9ecff" stroke-opacity=".7" stroke-width="10"/>
  <path d="M260 560 Q 512 470 764 560 L 764 600 Q 512 720 260 600 Z" fill="#fff"/>
  <path d="M512 330 L 590 470 L 434 470 Z M512 400 L 610 540 L 414 540 Z" fill="#2fa45a"/><rect x="496" y="540" width="32" height="40" fill="#7a4a24"/>
  ${dots(18, 3, '#fff', [300, 230, 420, 260])}
  <path d="M300 700 L 724 700 L 770 860 L 254 860 Z" fill="#b5332f"/><rect x="254" y="840" width="516" height="34" rx="10" fill="#8a2422"/>
  <path d="M330 270 A 240 240 0 0 1 470 190" stroke="#fff" stroke-opacity=".7" stroke-width="22" fill="none" stroke-linecap="round"/>`],

 ['Lights', 'Christmas light string', `
  <defs><linearGradient id="g5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#173a2a"/><stop offset="1" stop-color="#0a1f16"/></linearGradient></defs>
  <path d="${R}" fill="url(#g5)"/>
  ${snowCap(120, 300, 784, 80)}
  <path d="M120 330 Q 316 560 512 400 Q 708 240 904 470" stroke="#0d2a1a" stroke-width="14" fill="none"/>
  ${[0.1,0.3,0.5,0.7,0.9].map((t,i)=>{
     const seg=t<.5?0:1, u=seg?(t-.5)*2:t*2;
     const P=seg?[[512,400],[708,240],[904,470]]:[[120,330],[316,560],[512,400]];
     const x=(1-u)**2*P[0][0]+2*u*(1-u)*P[1][0]+u*u*P[2][0], y=(1-u)**2*P[0][1]+2*u*(1-u)*P[1][1]+u*u*P[2][1];
     const c=['#ff4a3d','#ffcc33','#3fd07a','#4aa3ff','#ff4a3d'][i];
     return `<circle cx="${x}" cy="${y+105}" r="110" fill="${c}" opacity=".22"/><g transform="rotate(${i%2?12:-12} ${x} ${y})"><rect x="${x-24}" y="${y-8}" width="48" height="48" rx="9" fill="#1e5a36"/>
     <path d="M${x-36} ${y+34} C ${x-74} ${y+110}, ${x-36} ${y+205}, ${x} ${y+218} C ${x+36} ${y+205}, ${x+74} ${y+110}, ${x+36} ${y+34} Z" fill="${c}"/>
     <ellipse cx="${x-17}" cy="${y+96}" rx="11" ry="24" fill="#fff" opacity=".6"/></g>`}).join('')}`],

 ['Gondola', 'Cable car over mountains', `
  <defs><linearGradient id="g6" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc4ff"/><stop offset="1" stop-color="#d6ecff"/></linearGradient></defs>
  <path d="${R}" fill="url(#g6)"/>
  <path d="M40 760 L 300 470 L 430 600 L 620 380 L 984 760 L 984 1024 L 40 1024 Z" fill="#5d7aa6"/>
  <path d="M300 470 L 360 537 L 330 560 L 300 530 L 268 565 L 245 532 Z M620 380 L 700 470 L 660 450 L 620 490 L 585 455 L 548 465 Z" fill="#fff"/>
  <path d="M40 820 Q 512 700 984 820 L 984 1024 L 40 1024 Z" fill="#fff"/>
  <line x1="60" y1="190" x2="964" y2="420" stroke="#2a2f3a" stroke-width="12"/>
  <rect x="500" y="260" width="26" height="110" fill="#3a404c" transform="rotate(14 512 300)"/>
  <rect x="370" y="350" width="290" height="250" rx="44" fill="#e2393b"/><rect x="370" y="350" width="290" height="40" rx="20" fill="#9a1f25"/>
  <rect x="400" y="410" width="230" height="110" rx="22" fill="#cfeaff"/><rect x="506" y="410" width="16" height="110" fill="#b52a30"/>
  <rect x="370" y="550" width="290" height="16" fill="#fff" opacity=".85"/>`],

 ['Drift', 'Snow drift under the moon', `
  <defs><linearGradient id="g7" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a4fa8"/><stop offset="1" stop-color="#151d4a"/></linearGradient></defs>
  <path d="${R}" fill="url(#g7)"/>
  <circle cx="700" cy="300" r="120" fill="#fff7d6"/><circle cx="650" cy="270" r="110" fill="#33479c"/>
  ${dots(30, 11, '#fff', [110, 120, 800, 480])}
  <path d="M40 700 C 200 600 330 640 470 690 C 620 740 760 600 984 640 L 984 1024 L 40 1024 Z" fill="#dfe8f7"/>
  <path d="M40 790 C 240 700 380 760 520 800 C 680 840 820 740 984 770 L 984 1024 L 40 1024 Z" fill="#fff"/>`],

 ['Desk', 'Snowy display', `
  <defs><linearGradient id="g8" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8a65"/><stop offset="1" stop-color="#d63864"/></linearGradient>
  <linearGradient id="s8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#284a8c"/><stop offset="1" stop-color="#0f1d42"/></linearGradient></defs>
  <path d="${R}" fill="url(#g8)"/>
  <rect x="170" y="300" width="684" height="440" rx="40" fill="#20242e"/><rect x="200" y="330" width="624" height="380" rx="18" fill="url(#s8)"/>
  ${dots(22, 5, '#fff', [220, 350, 580, 330])}
  <path d="M200 700 C 300 650 380 680 470 670 C 580 655 680 690 824 660 L 824 710 L 200 710 Z" fill="#fff"/>
  <path d="M440 740 L 584 740 L 610 830 L 414 830 Z" fill="#c9ccd6"/><rect x="360" y="826" width="304" height="26" rx="13" fill="#e7e9ef"/>
  ${snowCap(170, 300, 684, 70)}`],

 ['Flake', 'Minimal flake mark', `
  <path d="${R}" fill="#ffffff"/>
  ${flake(512, 512, 320, '#2f80ff', 64)}
  <circle cx="512" cy="512" r="60" fill="#2f80ff"/><circle cx="512" cy="512" r="26" fill="#fff"/>`],

 ['Plow', 'Loader pushing snow', `
  <defs><linearGradient id="g10" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a6d8ff"/><stop offset="1" stop-color="#5c9ee8"/></linearGradient>
  <linearGradient id="y10" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd23a"/><stop offset="1" stop-color="#e09a00"/></linearGradient></defs>
  <path d="${R}" fill="url(#g10)"/>${dots(22, 9, '#fff', [110, 110, 800, 280])}
  <path d="M40 800 L 984 800 L 984 1024 L 40 1024 Z" fill="#fff"/>
  <rect x="230" y="660" width="420" height="150" rx="75" fill="#2a2a30"/>
  ${[300,440,580].map(x=>`<circle cx="${x}" cy="735" r="50" fill="#8a8d96"/><circle cx="${x}" cy="735" r="18" fill="#d0d2d8"/>`).join('')}
  <rect x="220" y="560" width="440" height="110" rx="20" fill="url(#y10)"/>
  <path d="M330 560 L 330 360 L 560 360 L 600 450 L 600 560 Z" fill="#30333c"/><path d="M360 540 L 360 390 L 540 390 L 572 455 L 572 540 Z" fill="#bfe3ff"/>
  <rect x="316" y="340" width="300" height="36" rx="16" fill="url(#y10)"/>
  <path d="M600 520 L 760 600 L 790 700" stroke="#c88a00" stroke-width="56" fill="none" stroke-linejoin="round"/>
  <path d="M740 560 L 900 600 L 930 810 L 760 810 Z" fill="#454852"/>
  <path d="M880 650 C 940 620 984 660 984 720 L 984 800 L 900 810 Z" fill="#fff"/>
  <path d="M370 300 C 420 200 560 200 600 330 L 330 340 Z" fill="#2c9e52"/><circle cx="350" cy="300" r="26" fill="#e23b3b"/>`],
];

const grid = document.getElementById('grid');
logos.forEach(([name, desc, body], i) => {
  grid.insertAdjacentHTML('beforeend',
    `<div class="cell"><svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg"><defs><clipPath id="c${i}"><path d="${R}"/></clipPath></defs><g clip-path="url(#c${i})">${body}</g></svg>
     <div class="n">${i + 1}. ${name}</div><div class="d">${desc}</div></div>`);
});
</script></body></html>
